<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a1020" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="purpleLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @keyframes pulseRing {
      0% { r: 6px; opacity: 0.9; }
      50% { r: 16px; opacity: 0.3; }
      100% { r: 6px; opacity: 0.9; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatPillSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPillFast {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes subtleRotate {
      0% { transform: rotate(0deg); transform-origin: 1050px 100px; }
      100% { transform: rotate(360deg); transform-origin: 1050px 100px; }
    }
    @keyframes clusterBreathe {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.85; }
    }

    .pulse-node { animation: pulseRing 3.5s infinite ease-in-out; }
    .pulse-node-alt { animation: pulseRing 4.2s infinite ease-in-out; animation-delay: 1.5s; }
    .data-flow-1 { stroke-dasharray: 12 8; animation: flowLine 6s linear infinite; }
    .data-flow-2 { stroke-dasharray: 10 10; animation: flowLine 8s linear infinite reverse; }
    .data-flow-3 { stroke-dasharray: 8 6; animation: flowLine 5s linear infinite; }
    .pill-float-1 { animation: floatPillSlow 5s ease-in-out infinite; }
    .pill-float-2 { animation: floatPillFast 6s ease-in-out infinite; }
    .pill-float-3 { animation: floatPillSlow 7s ease-in-out infinite; animation-delay: 1s; }
    .orbit-spin { animation: subtleRotate 35s linear infinite; }
    .cluster-glow { animation: clusterBreathe 4s ease-in-out infinite; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Isometric / Geometric Storage Grid Lines (Subtle Background) -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Ambient Glowing Orbs in the background -->
  <circle cx="150" cy="80" r="160" fill="#0284c7" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="1060" cy="340" r="180" fill="#7c3aed" opacity="0.18" filter="url(#softGlow)" />
  <circle cx="600" cy="400" r="120" fill="#0ea5e9" opacity="0.12" filter="url(#softGlow)" />

  <!-- Animated Data Flow Curves (Storage Interconnects: Ceph RADOS / NVMe-oF / RDMA mesh) -->
  <g fill="none">
    <path d="M 50 180 Q 220 50 420 120 T 800 90 T 1150 160" stroke="url(#cyanLine)" stroke-width="2.5" class="data-flow-1" opacity="0.6" />
    <path d="M 60 280 Q 300 370 560 300 T 940 330 T 1160 260" stroke="url(#purpleLine)" stroke-width="2.5" class="data-flow-2" opacity="0.55" />
    <path d="M 120 70 Q 280 230 500 170 T 900 240 T 1100 80" stroke="#38bdf8" stroke-width="1.5" class="data-flow-3" opacity="0.4" />
  </g>

  <!-- Distributed Storage Node Network Vertices (Dynamic Pulses) -->
  <g>
    <!-- Left Cluster Nodes -->
    <circle cx="120" cy="140" r="12" fill="#38bdf8" opacity="0.3" class="pulse-node" />
    <circle cx="120" cy="140" r="5" fill="#38bdf8" />
    
    <circle cx="80" cy="240" r="14" fill="#818cf8" opacity="0.25" class="pulse-node-alt" />
    <circle cx="80" cy="240" r="5" fill="#818cf8" />
    
    <circle cx="190" cy="310" r="10" fill="#c084fc" opacity="0.3" class="pulse-node" />
    <circle cx="190" cy="310" r="4" fill="#c084fc" />

    <!-- Right Cluster Nodes -->
    <circle cx="1050" cy="100" r="14" fill="#38bdf8" opacity="0.25" class="pulse-node" />
    <circle cx="1050" cy="100" r="5" fill="#38bdf8" />
    
    <circle cx="1120" cy="220" r="12" fill="#818cf8" opacity="0.3" class="pulse-node-alt" />
    <circle cx="1120" cy="220" r="5" fill="#818cf8" />

    <circle cx="1030" cy="320" r="15" fill="#c084fc" opacity="0.25" class="pulse-node" />
    <circle cx="1030" cy="320" r="5" fill="#c084fc" />
  </g>

  <!-- Interactive Dynamic Floating Tech Badges (Placed safely on perimeter) -->
  <!-- Top Left Pill -->
  <g class="pill-float-1" transform="translate(60, 42)">
    <rect width="180" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="20" cy="17" r="4" fill="#38bdf8" />
    <text x="35" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">Unified Ceph &amp; Rook</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="pill-float-2" transform="translate(70, 350)">
    <rect width="210" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="20" cy="17" r="4" fill="#818cf8" />
    <text x="35" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">POSIX • S3 • NVMe-oF</text>
  </g>

  <!-- Top Right Pill -->
  <g class="pill-float-3" transform="translate(950, 42)">
    <rect width="190" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" opacity="0.9" />
    <circle cx="20" cy="17" r="4" fill="#c084fc" />
    <text x="35" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">Distributed File Systems</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="pill-float-1" transform="translate(940, 350)">
    <rect width="200" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="20" cy="17" r="4" fill="#38bdf8" />
    <text x="35" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">Kubernetes CSI &amp; Block</text>
  </g>

  <!-- Center Decorative Storage Server Stack (Subtle Isometric Vector) -->
  <g opacity="0.4" class="cluster-glow" transform="translate(560, 50)">
    <rect x="0" y="0" width="80" height="12" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <circle cx="10" cy="6" r="2" fill="#10b981" />
    <circle cx="18" cy="6" r="2" fill="#38bdf8" />
    <line x1="30" y1="6" x2="72" y2="6" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 2" />

    <rect x="0" y="16" width="80" height="12" rx="3" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <circle cx="10" cy="22" r="2" fill="#10b981" />
    <circle cx="18" cy="22" r="2" fill="#818cf8" />
    <line x1="30" y1="22" x2="72" y2="22" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 2" />

    <rect x="0" y="32" width="80" height="12" rx="3" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
    <circle cx="10" cy="38" r="2" fill="#10b981" />
    <circle cx="18" cy="38" r="2" fill="#c084fc" />
    <line x1="30" y1="38" x2="72" y2="38" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 2" />
  </g>

  <!-- ======================================================== -->
  <!-- FOREGROUND HERO CARD (GUARANTEES TEXT NEVER GETS HIDDEN) -->
  <!-- ======================================================== -->
  <g filter="url(#cardShadow)">
    <rect x="180" y="105" width="840" height="215" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="180" y="105" width="840" height="215" rx="20" fill="none" stroke="url(#glowGrad)" stroke-width="2" />
  </g>

  <!-- Foreground Content: Header Tag, Title, Subtitle, Feature Badges -->
  <g>
    <!-- Top Category Eyebrow Pill -->
    <g transform="translate(480, 126)">
      <rect width="240" height="26" rx="13" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1" />
      <text x="120" y="17.5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" text-anchor="middle">
        STORAGE INFRASTRUCTURE ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" fill="url(#titleGrad)">
      Awesome Software-Defined Storage
    </text>

    <!-- Subtitle -->
    <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated Catalog of Distributed File Systems, Cloud-Native Block Storage &amp; Enterprise SDS
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(240, 265)">
      <!-- Tag 1 -->
      <g transform="translate(0, 0)">
        <rect width="130" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="65" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">📦 Block Storage</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(145, 0)">
        <rect width="135" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="67.5" y="18" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🗂️ Distributed FS</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(295, 0)">
        <rect width="125" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="62.5" y="18" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">🪣 Object (S3)</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(435, 0)">
        <rect width="140" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="70" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">☸️ Kubernetes CSI</text>
      </g>
      <!-- Tag 5 -->
      <g transform="translate(590, 0)">
        <rect width="130" height="28" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="65" y="18" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">⚡ High-IOPS NVMe</text>
      </g>
    </g>
  </g>

  <!-- Border Highlight Outer Ring -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#1e293b" stroke-width="2" />
</svg>
